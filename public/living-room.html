<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Room — Rex Hamilton</title>
  <!-- Transparent favicon: hides the browser's default placeholder icon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1><a href="/" data-blurb="site.name">Rex Hamilton</a></h1>
    <nav>
      <a href="/" data-blurb="nav.home">Front Door</a>
      <a href="/living-room" aria-current="page" data-blurb="nav.living-room">Living Room</a>
      <a href="/writing" data-blurb="nav.writing">Study</a>
      <a href="/contact" data-blurb="nav.contact">Mailbox</a>
    </nav>
  </header>

  <main>
    <h2 data-blurb="living-room.title">Living Room</h2>

    <div class="tabs" role="tablist" aria-label="Living Room">
      <a role="tab" href="#bookshelf" id="tab-bookshelf" aria-controls="bookshelf" aria-selected="true" data-blurb="living-room.tab.bookshelf">Bookshelf</a>
      <a role="tab" href="#record-player" id="tab-record-player" aria-controls="record-player" aria-selected="false" tabindex="-1" data-blurb="living-room.tab.record-player">Record Player</a>
    </div>

    <section id="bookshelf" role="tabpanel" aria-labelledby="tab-bookshelf">
      <ul class="shelf" data-shelf="books"></ul>
    </section>

    <section id="record-player" role="tabpanel" aria-labelledby="tab-record-player" hidden>
      <ul class="shelf" data-shelf="records"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> <span data-blurb="footer.name">Rex Hamilton</span></p>
  </footer>

  <script type="module" src="/main.js"></script>
  <script type="module" src="/edit.js"></script>
</body>
</html>
